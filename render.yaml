services:
  - type: web
    name: fuwafuwa-portfolio
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      - key: DB_PATH
        value: /app/data/portfolio.db
    disk:
      name: portfolio-data
      mountPath: /app/data
      sizeGB: 1
